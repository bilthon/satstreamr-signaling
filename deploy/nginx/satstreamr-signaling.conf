# Snippet for the existing HTTPS server block, not a standalone site.
# Add or replace location /ws inside server { ... }; keep the existing
# TLS/Certbot, frontend, and /mint/ configuration unchanged.
# Clients connect to wss://satstreamr.com/ws.
location /ws {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Match the existing production configuration's idle timeouts.
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
