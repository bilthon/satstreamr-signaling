# /etc/turnserver.conf (coturn) — TURN relay for satstreamr.
# The signaling server mints time-limited credentials with HMAC over
# TURN_SHARED_SECRET; coturn validates them with the same static-auth-secret.

listening-port=3478
# TLS TURN (optional, helps behind restrictive firewalls):
# tls-listening-port=5349
# cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem

# Public IP of this host. Behind NAT (e.g. cloud VMs): external-ip=<public>/<private>
external-ip=203.0.113.10

realm=turn.example.com
use-auth-secret
static-auth-secret=CHANGE_ME_same_value_as_TURN_SHARED_SECRET

# Relay port range; open it for UDP in the firewall.
min-port=49152
max-port=65535

fingerprint
no-cli
no-multicast-peers
# Block relaying to private/loopback ranges (SSRF protection).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1

log-file=syslog
simple-log
